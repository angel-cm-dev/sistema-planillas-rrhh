name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restaurar dependencias
        run: dotnet restore Planillas.sln
      - name: Compilar
        run: dotnet build Planillas.sln --no-restore -c Release
      - name: Pruebas unitarias e integración (SQLite en memoria)
        run: dotnet test Planillas.sln --no-build -c Release --logger "trx;LogFileName=resultados.trx"
      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas-backend
          path: backend/tests/**/TestResults/*.trx

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Pruebas (Vitest)
        run: npm test
      - name: Build
        run: npm run build
